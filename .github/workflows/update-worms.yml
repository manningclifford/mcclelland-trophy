name: Update worm cache

on:
  schedule:
    # Fri/Sat/Sun/Mon at 04:00 AEST (18:00 UTC Thu/Fri/Sat/Sun)
    # Runs March–October only (AFL season). Skips itself outside that window.
    - cron: '0 18 * * 0,4,5,6'
  workflow_dispatch:
    inputs:
      year:
        description: 'Season year (leave blank for current year)'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check if AFL season is active (March–October)
        id: season_check
        run: |
          MONTH=$(date -u +%-m)
          if [ "$MONTH" -ge 3 ] && [ "$MONTH" -le 10 ]; then
            echo "active=true" >> $GITHUB_OUTPUT
          else
            echo "active=false" >> $GITHUB_OUTPUT
            echo "Outside AFL season (month $MONTH) — skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'

      - name: Set up R
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Cache R packages
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-4.4-ubuntu-fitzRoy-jsonlite-v2
          restore-keys: r-4.4-ubuntu-

      - name: Install R packages
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: Rscript -e 'install.packages(c("fitzRoy","jsonlite"), repos="https://cloud.r-project.org", dependencies=TRUE)'

      - name: Set up Node
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Fetch worms for current year
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: Rscript server/scripts/fetch_worms_year.R ${{ github.event.inputs.year || '' }}

      - name: Merge worms into public cache
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: node server/scripts/mergeRawWorms.js

      - name: Patch worm scores
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: node server/scripts/patchWormScores.js

      - name: Patch game evolution for current year
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: Rscript server/scripts/patch_game_evolution.R

      - name: Patch attendance for current year
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: node server/scripts/patchAttendanceYear.js

      - name: Patch linear title for current year
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: node server/scripts/patchLinearTitle.js

      - name: Patch all-time AFL standings for current year
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: node server/scripts/patchAlltimeAFL.js

      - name: Update style taxonomy for current year
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: node server/scripts/buildStyleTaxonomy.js ${{ github.event.inputs.year || '' }}

      - name: Commit and push if data changed
        if: steps.season_check.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/worm_cache.json public/game_evolution.json public/attendance.json public/linear_title.json public/alltime_afl.json public/style_taxonomy.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: data refresh $(date -u '+%Y-%m-%d')"
            git push
          fi
