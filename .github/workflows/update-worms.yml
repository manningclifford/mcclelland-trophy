name: Update worm cache

on:
  schedule:
    # Fri/Sat/Sun/Mon at 04:00 AEST (18:00 UTC Thu/Fri/Sat/Sun)
    # Note: during AEDT (Oct–Apr) this runs at 05:00 local instead of 04:00
    - cron: '0 18 * * 0,4,5,6'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::fitzRoy
            any::jsonlite

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Fetch worms for current year
        run: Rscript server/scripts/fetch_worms_year.R ${{ github.event.inputs.year || '' }}

      - name: Merge worms into public cache
        run: node server/scripts/mergeRawWorms.js

      - name: Patch game evolution for current year
        run: Rscript server/scripts/patch_game_evolution.R

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/worm_cache.json public/game_evolution.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly data refresh ($(date -u '+%Y-%m-%d'))"
            git push
          fi
